
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">

  <title>Teaghan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #0b0f19;
      --text: #ffffff;
      --muted: #9ca9bf;
      --accent: #8da7ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 24px;
    }

    /* Subtle background glow */
    body::before {
      content: "";
      position: fixed;
      width: 650px;
      height: 650px;
      background: radial-gradient(
        circle,
        rgba(75, 105, 200, 0.12) 0%,
        transparent 70%
      );
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      max-width: 720px;
      width: 100%;
      text-align: center;
      animation: fadeIn 1s ease-out both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--accent);
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 1.1;
      margin-bottom: 24px;
    }

    .description {
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.8;
      max-width: 500px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      margin-top: 36px;
      padding: 11px 20px;
      border: 1px solid rgba(141, 167, 255, 0.18);
      background: rgba(141, 167, 255, 0.06);
      border-radius: 100px;
      color: #b9c7e8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    footer {
      position: fixed;
      bottom: 28px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #556176;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -0.04em;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.5px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- EDIT YOUR TEXT BELOW -->

    <div class="eyebrow">
      <span class="dot"></span>
      Teaghan loves Jack's big dih
    </div>

    <h1>TRUE<br>face.</h1>

    <p class="description">
      She loves it so much, she can never stop talking about it
    </p>

    <div class="badge">
      Wanna crack Teaghan?
    </div>

    <!-- END OF EDITABLE TEXT -->

  </main>

  <footer>
    © 2026 Jack Palmer. All rights reserved.
  </footer>

</body>
</html>

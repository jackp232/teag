
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">

  <title>Teaghan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #0b0f19;
      --text: #ffffff;
      --muted: #9ca9bf;
      --accent: #91a9ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        rgba(75, 105, 200, 0.12),
        transparent 70%
      );
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      text-align: center;
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.8s ease both;
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(145, 169, 255, 0.1);
      color: var(--accent);
      font-size: 28px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 44px);
      letter-spacing: -0.05em;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .description {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .progress-track {
      width: 220px;
      max-width: 100%;
      height: 4px;
      border-radius: 20px;
      background: #293248;
      margin: 0 auto 18px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: 20px;
      animation: progress var(--duration) linear forwards;
    }

    .status {
      color: #8591a6;
      font-size: 12px;
    }

    .fallback {
      display: inline-block;
      margin-top: 36px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .fallback:hover {
      opacity: 0.7;
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">↗</div>

    <h1>Redirecting you...</h1>

    <p class="description">
      You're being taken to your destination.<br>
      This will only take a moment.
    </p>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <p class="status" id="status">
      Please wait a moment
    </p>

    <a class="fallback" id="fallback" href="#">
      Click here if you're not redirected →
    </a>

  </main>

  <script>
    // ========================================
    // CUSTOMISE YOUR REDIRECT HERE
    // ========================================

    const REDIRECT_URL = "https://scontent.fhlz3-1.fna.fbcdn.net/v/t1.6435-9/120498848_10159266300266424_2820972630319250375_n.jpg?stp=dst-jpg_tt6&cstp=mx720x960&ctp=s720x960&_nc_cat=102&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=33274f&_nc_ohc=2LiazVr6OKgQ7kNvwF-vp8Q&_nc_oc=Adq3imIt1tm_OKheL8aVStE_ACQa4T9-carfd8Lr_rL4ePC5THvqTigdMo6KciDG_AE&_nc_zt=23&_nc_ht=scontent.fhlz3-1.fna&_nc_gid=EJBER1fOD4jSGD3FFypweA&_nc_ss=7b2a8&oh=00_AQTCsVUXvDhMl_tk_s2V3WXrH-gTSfY3qIY2a9cvf2xW3Q&oe=6B232045";

    // Delay in seconds
    const REDIRECT_DELAY = 1;

    // ========================================
    // REDIRECT LOGIC
    // ========================================

    const destination = new URL(
      REDIRECT_URL,
      window.location.href
    );

    const delay = Math.max(0, REDIRECT_DELAY);

    document.documentElement.style.setProperty(
      "--duration",
      `${delay}s`
    );

    const fallback = document.getElementById("fallback");

    fallback.href = destination.href;

    document.getElementById("status").textContent =
      `Redirecting in ${delay} seconds...`;

    setTimeout(() => {
      window.location.replace(destination.href);
    }, delay * 1000);
  </script>

</body>
</html>
